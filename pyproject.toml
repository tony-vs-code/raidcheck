[project]
name = "systemalerts"
version = "1.0.9"
description = "Vigil: Lightweight Linux Host Operations & Observability Suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohappyeyeballs==2.4.0",
    "aiohttp==3.10.5",
    "aiosignal==1.3.1",
    "attrs==24.2.0",
    "discord-py==2.4.0",
    "frozenlist==1.4.1",
    "idna==3.8",
    "multidict==6.0.5",
    "python-decouple==3.8",
    "yarl==1.9.6",
    "psutil>=6.0.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "api"]

